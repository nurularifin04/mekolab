<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekolab: Mekorama Level Editor</title>
</head>
<body>
    <!-- MAIN PAGE -->
  <div class="main-page">
    <h1 id="title-page">MekoLab</h1>
    <div class="card-collector">
      <input id="image-input" type="file" accept="image/*" multiple>
      <label id ="label-image-input" for="image-input">
        <img class="add-card" src="assets/add.png">
      </label>
    </div>
    <div class="main-toolbar">
      <button id="delete-card">delete</button>
      <button id="play-online">play_arrow</button>
      <button id="level-editor">brick</button>
      <button id="share-card">share</button>
    </div>
  </div>
</body>
</html>
